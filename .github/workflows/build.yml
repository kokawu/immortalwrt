name: Build firmware

on:
  workflow_dispatch:
    inputs:
      publish_updates:
        description: "Publish a Release and notify the online stable update channel"
        type: boolean
        default: true
        required: true
  push:
    tags:
      - "build-*"
      - "kokawu-*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x86_64 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check online-upgrade code
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 shellcheck
          python3 -m unittest discover -s tests/online-upgrade -p 'test_*.py' -v
          lua5.1 tests/online-upgrade/policy.lua
          lua5.1 tests/online-upgrade/backend.lua
          node --check package/luci-app-kokawu-upgrade/htdocs/luci-static/resources/view/system/kokawu-upgrade.js
          shellcheck -S error scripts/kokawu-publish-release.sh package/luci-app-kokawu-upgrade/root/usr/libexec/kokawu-upgrade-layout package/luci-app-kokawu-upgrade/root/etc/uci-defaults/95-kokawu-upgrade

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-immortalwrt-x86-64
          max-size: 2G

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject netdata C++14 patch
        run: |
          patch_dir="feeds/packages/admin/netdata/patches"
          netdata_makefile="feeds/packages/admin/netdata/Makefile"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("feeds/packages/admin/netdata/Makefile")
          text = path.read_text()
          needle = "\t--with-math \\\n"
          replacement = "\t--with-math \\\n\t--disable-cloud \\\n"
          if "--disable-cloud" not in text:
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          print(path)
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path("feeds/timecontrol/luci-app-timecontrol/root/usr/share/luci/menu.d/luci-app-timecontrol.json")
          text = path.read_text()
          text = text.replace("admin/control/timecontrol", "admin/services/timecontrol")
          path.write_text(text)
          print(path)
          PY
          mkdir -p "$patch_dir"
          rm -f "$patch_dir/005-netdata-use-cxx14-for-protobuf.patch"
          cat >"$patch_dir/005-netdata-use-cxx14-for-protobuf.patch" <<'EOF'
          --- a/configure.ac
          +++ b/configure.ac
          @@ -815,7 +815,7 @@ if test "${have_libprotobuf}" == "yes" && test "${have_CXX_compiler}" == "yes";
                   AC_DEFINE([ENABLE_ACLK], [1], [netdata ACLK])
                   OPTIONAL_ACLK_CFLAGS="-I \$(abs_top_srcdir)/mqtt_websockets/src/include -I \$(abs_top_srcdir)/mqtt_websockets/c-rbuf/include -I \$(abs_top_srcdir)/aclk/aclk-schemas"
                   OPTIONAL_PROTOBUF_CFLAGS="${PROTOBUF_CFLAGS}"
          -        CXX11FLAG="-std=c++11"
          +        CXX11FLAG="-std=c++14"
                   OPTIONAL_PROTOBUF_LIBS="${PROTOBUF_LIBS}"
               fi
           fi
          @@ -1145,7 +1145,7 @@ fi
           
           # Check if C++ toolchain does not support C++11. Fail if ML was explicitly requested.
           AC_LANG_PUSH([C++])
          -AX_CHECK_COMPILE_FLAG([-std=c++11], [have_cxx11=yes], [have_cxx11=no])
          +AX_CHECK_COMPILE_FLAG([-std=c++14], [have_cxx11=yes], [have_cxx11=no])
           AC_LANG_POP([C++])
           
           # PPC64LE needs -std=gnu++11 in order to build dlib. However, the rest of
          @@ -1158,7 +1158,7 @@ if test "${host_cpu}" = "powerpc64le"; then
           if test "${enable_ml}" = "yes" -a "${have_cxx11}" = "no"; then
               AC_MSG_ERROR([You have explicitly requested --enable-ml functionality but it cannot be built without a C++11 toolchain.])
           else
          -    CXX11FLAG="$CXX11FLAG -std=c++11"
          +    CXX11FLAG="$CXX11FLAG -std=c++14"
           fi
           
           # Decide if we should build ML
          @@ -1359,7 +1359,7 @@ if test "${enable_exporting_pubsub}" != "no" -a "${have_pubsub_protos}" = "yes"
               enable_exporting_pubsub="yes"
               AC_DEFINE([ENABLE_EXPORTING_PUBSUB], [1], [Pub/Sub API usability])
               OPTIONAL_PUBSUB_CFLAGS="${GRPC_CFLAGS} ${PUBSUB_CFLAGS}"
          -    CXX11FLAG="-std=c++11"
          +    CXX11FLAG="-std=c++14"
               OPTIONAL_PUBSUB_LIBS="${GRPC_LIBS} ${PUBSUB_LIBS}"
           else
               enable_pubsub="no"
          @@ -1379,7 +1379,7 @@ AC_MSG_CHECKING([for snappy::RawCompress in -lsnappy])
               AC_LANG_CPLUSPLUS
               save_LIBS="${LIBS}"
               LIBS="-lsnappy"
          -    save_CXXFLAGS="${CXXFLAGS}"
          -    CXXFLAGS="${CXXFLAGS} -std=c++11"
          +    save_CXXFLAGS="${CXXFLAGS}"
          +    CXXFLAGS="${CXXFLAGS} -std=c++14"
           
               AC_TRY_LINK(
                   [
          @@ -1425,7 +1425,7 @@ if test "${enable_exporting_prometheus_remote_write}" != "no" -a "${have_libprot
               enable_exporting_prometheus_remote_write="yes"
               AC_DEFINE([ENABLE_PROMETHEUS_REMOTE_WRITE], [1], [Prometheus remote write API usability])
               OPTIONAL_PROMETHEUS_REMOTE_WRITE_CFLAGS="${SNAPPY_CFLAGS} -I \$(abs_top_srcdir)/exporting/prometheus/remote_write"
          -    CXX11FLAG="-std=c++11"
          +    CXX11FLAG="-std=c++14"
               OPTIONAL_PROMETHEUS_REMOTE_WRITE_LIBS="${SNAPPY_LIBS}"
               OPTIONAL_PROTOBUF_CFLAGS="${PROTOBUF_CFLAGS}"
               OPTIONAL_PROTOBUF_LIBS="${PROTOBUF_LIBS}"
          EOF
          ls -l "$patch_dir"

      - name: Generate config
        run: |
          cp seed.config .config
          make defconfig
          # Fail rather than silently producing an APK/opkg mixed image.
          grep -qx 'CONFIG_USE_APK=y' .config
          grep -qx 'CONFIG_PACKAGE_apk-openssl=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-package-manager=y' .config
          if grep -Eq '^CONFIG_PACKAGE_(opkg|luci-app-opkg|luci-i18n-opkg-[^=]+)=(y|m)$' .config; then
            echo "::error::opkg was re-enabled by a dependency; fix that dependency before building."
            exit 1
          fi
          grep -qx 'CONFIG_PACKAGE_luci-app-kokawu-upgrade=y' .config
          # Required by the LuCI template runtime; missing it breaks page rendering.
          grep -qx 'CONFIG_PACKAGE_ucode-mod-math=y' .config
          ./scripts/diffconfig.sh > build.config

      - name: Embed immutable online-upgrade identity
        run: python3 scripts/kokawu-online-release.py identity

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-build-failure-${{ github.ref_name }}
          path: |
            build.log
            .config
            build.config
            logs/
          if-no-files-found: warn

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find bin/targets -type f \( \
            -name "*.bin" -o \
            -name "*.img" -o \
            -name "*.img.gz" -o \
            -name "*.qcow2" -o \
            -name "*.qcow2.gz" -o \
            -name "*.vmdk" -o \
            -name "*.vmdk.gz" -o \
            -name "*.efi" -o \
            -name "*.manifest" -o \
            -name "sha256sums" \) -print -exec cp -a {} artifacts/ \;
          cp -a build.config artifacts/
          python3 scripts/kokawu-online-release.py manifest
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish complete firmware and update channel
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_updates == true
    runs-on: ubuntu-24.04
    # Serialize channel read/compare/write even when builds run on different refs.
    concurrency:
      group: kokawu-online-stable-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: immortalwrt-x86-64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Publish immutable version, then channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/kokawu-publish-release.sh
