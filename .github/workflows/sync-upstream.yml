name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      build_after_sync:
        description: "Trigger firmware build after a successful upstream sync"
        required: true
        type: boolean
        default: true
  schedule:
    # Daily at 03:37 Asia/Shanghai (19:37 UTC on the previous day).
    - cron: "37 19 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase local changes on upstream master
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch origin master --tags
          git fetch upstream master --tags
          git checkout -B master origin/master

      - name: Rebase on upstream
        id: sync
        run: |
          set -euo pipefail

          echo "Current fork master: $(git rev-parse --short master)"
          echo "Current upstream master: $(git rev-parse --short upstream/master)"

          if git merge-base --is-ancestor upstream/master master; then
            echo "Upstream master is already included in this fork."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream has new commits. Local commits to preserve:"
          git log --oneline upstream/master..master || true

          git rebase upstream/master

          echo "Rebased fork master: $(git rev-parse --short master)"
          git push --force-with-lease origin master

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Recover partial failures even when upstream is already synchronized.
      - name: Ensure firmware build
        if: github.event_name == 'schedule' || inputs.build_after_sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/kokawu-ensure-build.sh
